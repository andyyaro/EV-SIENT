name: tests

on:
  push:
    branches: [main, milestone2-v3-professional-release]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python tests, contract, reconciliation, links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run test suite with coverage gate
        run: python -m pytest tests/ -q --cov=fcf_m2 --cov-fail-under=80

      - name: Legacy baseline reproduction (25 starter / 48 pathway)
        run: |
          python -m fcf_m2.workflow run --mode legacy_v2 --out data/outputs/ci_legacy
          grep -q '"starter_total": 25' data/outputs/ci_legacy/run_summary.json
          grep -q '"pathway_total": 48' data/outputs/ci_legacy/run_summary.json

      - name: Validate tracked canonical contract (rules + schema + hash chain)
        run: python -m fcf_m2.workflow validate-contract data/contract/v1

      - name: Cross-model reconciliation (contract vs MATLAB canonical CSV)
        run: |
          python - <<'EOF'
          import pandas as pd
          st = pd.read_csv("data/contract/v1/scenario_table.csv")
          m = pd.read_csv("matlab/data/canonical/matlab_scenarios.csv")
          assert set(st.horizon_year) == set(m.horizon_year) == {2026, 2036, 2046, 2056}
          mg = st.merge(m, on="scenario_id"); assert len(mg) == len(st) == 120
          assert (mg.ports_active == mg.ports).all()
          assert mg.capacity_basis_y.notna().all()
          print("cross-model OK")
          EOF

      - name: Internal Markdown links
        run: python scripts/check_internal_links.py

      - name: Secret scan (pattern-based)
        run: |
          ! git grep -nIiE 'AKIA[0-9A-Z]{16}|aws_secret_access_key|BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}' -- . ':!.github/workflows/tests.yml' ':!scripts/verify.sh'

name: tests

# CI and scripts/verify.sh must run the same gates. The way to guarantee that is not to keep
# two lists in step, but to have only one list: CI invokes verify.sh, which is the single
# definition of what "green" means. Previously CI ran 6 of verify.sh's 10 gates and used a
# different secret-scan exclusion set, so a contributor could pass locally and fail in CI, or
# the reverse -- which is how the tree came to sit at 8 PASS / 2 FAIL with CI green.

on:
  # A push to a branch with an open pull request used to run this twice, once per event, on a
  # private repository where minutes are metered. A branch is checked through its pull
  # request; main is checked on every push; anything else can be dispatched by hand.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request makes the older run's answer irrelevant.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification (all gates)
    runs-on: ubuntu-latest
    # A hung test must not burn an hour of the runner allowance. One did:
    # a test that started a real server and blocked on threading.Event().wait()
    # ran for 61 minutes before anyone noticed, on a private repo where minutes
    # are metered. Fail fast and loudly instead.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package with test extras
        # -c pins the same resolved versions the Makefile and requirements-lock.txt use,
        # so CI tests the dependency set that is actually locked rather than whatever
        # resolves fresh on the runner.
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test] -c requirements-lock.txt

      - name: Report resolved environment
        run: |
          python --version
          pip freeze

      - name: Run every repository verification gate
        # VENV_PY points verify.sh at the runner's interpreter instead of ./venv.
        # verify.sh prints a per-gate PASS/FAIL table and exits with the failure count.
        run: VENV_PY=$(command -v python) ./scripts/verify.sh

  platform:
    # The planner runs the engine in the browser under Pyodide. This job holds the two
    # runtimes together: the same browser_api calls, run natively and under Pyodide with
    # exactly the files the browser gets, must agree to 1e-9 (platform/tools/parity.mjs).
    # It also type-checks and builds the app. Python 3.14 matches Pyodide 314's Python.
    #
    # Then it checks the built app in Chromium and WebKit with the real engine, served under
    # the production CSP: axe-core and the keyboard walk-through (a11y_audit.py), the layout
    # matrix at three window sizes (matrix.py), and install plus offline use (offline_check.py).
    # These are steps here rather than a job of their own because they need exactly the build
    # above: a separate job would either build the runtime, engine and app a second time or
    # wait for this one and download the build, on a private repository where minutes are
    # metered. The job name is unchanged so a required status check that names it still matches.
    name: Planner (browser engine parity and app build)
    runs-on: ubuntu-latest
    # About 6 minutes to build and 6 to 10 for the browser checks on a cold runner.
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install the engine's dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -c requirements-lock.txt

      - name: Install the app's packages
        working-directory: platform/app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Cache the Pyodide download
        # The runtime files are pinned by version and checked against their SHA-256, so a
        # cached copy is the same bytes; this only saves about 20 MB of download per run.
        uses: actions/cache@v6
        with:
          path: platform/app/.cache
          key: pyodide-${{ hashFiles('platform/tools/fetch_runtime.mjs') }}

      - name: Fetch the pinned runtime and build the engine archive
        run: |
          node platform/tools/fetch_runtime.mjs
          python platform/tools/build_engine.py

      - name: Native and browser engines agree
        run: VENV_PY=$(command -v python) node platform/tools/parity.mjs

      - name: Type-check and build the app
        working-directory: platform/app
        run: npm run build

      # ---- Browser checks of the built app ----
      # requirements-qa.txt pins Playwright, and Playwright pins its browser builds, so that
      # file is the cache key for the browsers. The system libraries WebKit needs are not
      # cached; install-deps puts them back from apt on a cache hit.
      - name: Install Playwright
        run: pip install -r platform/tools/requirements-qa.txt

      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('platform/tools/requirements-qa.txt') }}

      - name: Install Chromium and WebKit
        env:
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            python -m playwright install-deps chromium webkit
          else
            python -m playwright install --with-deps --only-shell chromium webkit
          fi
          # offline_check.py serves large files Brotli-encoded, as CloudFront does.
          command -v brotli >/dev/null || sudo apt-get install -y --no-install-recommends brotli

      - name: Fetch axe-core 4.13.0
        # Not a dependency of the app: the published tarball, checked against its SHA-256.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/axe-core.tgz" https://registry.npmjs.org/axe-core/-/axe-core-4.13.0.tgz
          echo "096912f6e77b4b695fc9304b7be65091db42d98de054da674ae222a11cb33f70  $RUNNER_TEMP/axe-core.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/axe-core.tgz" -C "$RUNNER_TEMP" package/axe.min.js

      - name: Serve the build under the production CSP
        id: serve
        # The server outlives this step; the runner stops it when the job ends.
        run: |
          mkdir -p "$RUNNER_TEMP/qa"
          nohup python platform/tools/serve_csp.py platform/app/dist --port 5311 > "$RUNNER_TEMP/qa/serve.log" 2>&1 &
          for _ in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:5311/ && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/qa/serve.log"; exit 1

      # Each check runs whether or not the one before it failed, so one run reports them all.
      # Each exits non-zero on any finding.
      - name: Accessibility (axe-core in four themes, and the whole flow by keyboard)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: >-
          python platform/tools/a11y_audit.py http://127.0.0.1:5311 "$RUNNER_TEMP/qa/a11y"
          --axe "$RUNNER_TEMP/package/axe.min.js" --browsers chromium,webkit --sizes 1440x900,390x844 --shots

      - name: Layout matrix (no sideways scroll, nothing covered, targets large enough)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: >-
          python platform/tools/matrix.py http://127.0.0.1:5311 "$RUNNER_TEMP/qa/matrix"
          --browsers chromium,webkit --sizes 1440x900,390x844,320x640 --themes light,dark

      - name: Install and offline use
        # Starts its own server on port 5312, so it can stop it and reload with the origin gone.
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: >-
          python platform/tools/offline_check.py platform/app/dist --port 5312
          --browsers chromium,webkit --json "$RUNNER_TEMP/qa/offline.json"

      - name: Upload the findings and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: planner-browser-checks
          path: ${{ runner.temp }}/qa
          if-no-files-found: ignore
          retention-days: 14

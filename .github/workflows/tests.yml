name: tests

# CI and scripts/verify.sh must run the same gates. The way to guarantee that is not to keep
# two lists in step, but to have only one list: CI invokes verify.sh, which is the single
# definition of what "green" means. Previously CI ran 6 of verify.sh's 10 gates and used a
# different secret-scan exclusion set, so a contributor could pass locally and fail in CI, or
# the reverse -- which is how the tree came to sit at 8 PASS / 2 FAIL with CI green.

on:
  # A push to a branch with an open pull request used to run this twice, once per event, on a
  # private repository where minutes are metered. A branch is checked through its pull
  # request; main is checked on every push; anything else can be dispatched by hand.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request makes the older run's answer irrelevant.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification (all gates)
    runs-on: ubuntu-latest
    # A hung test must not burn an hour of the runner allowance. One did:
    # a test that started a real server and blocked on threading.Event().wait()
    # ran for 61 minutes before anyone noticed, on a private repo where minutes
    # are metered. Fail fast and loudly instead.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package with test extras
        # -c pins the same resolved versions the Makefile and requirements-lock.txt use,
        # so CI tests the dependency set that is actually locked rather than whatever
        # resolves fresh on the runner.
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test] -c requirements-lock.txt

      - name: Report resolved environment
        run: |
          python --version
          pip freeze

      - name: Run every repository verification gate
        # VENV_PY points verify.sh at the runner's interpreter instead of ./venv.
        # verify.sh prints a per-gate PASS/FAIL table and exits with the failure count.
        run: VENV_PY=$(command -v python) ./scripts/verify.sh

  platform:
    # The planner runs the engine in the browser under Pyodide. This job holds the two
    # runtimes together: the same browser_api calls, run natively and under Pyodide with
    # exactly the files the browser gets, must agree to 1e-9 (platform/tools/parity.mjs).
    # It also type-checks and builds the app. Python 3.14 matches Pyodide 314's Python.
    name: Planner (browser engine parity and app build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install the engine's dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -c requirements-lock.txt

      - name: Install the app's packages
        working-directory: platform/app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Cache the Pyodide download
        # The runtime files are pinned by version and checked against their SHA-256, so a
        # cached copy is the same bytes; this only saves about 20 MB of download per run.
        uses: actions/cache@v6
        with:
          path: platform/app/.cache
          key: pyodide-${{ hashFiles('platform/tools/fetch_runtime.mjs') }}

      - name: Fetch the pinned runtime and build the engine archive
        run: |
          node platform/tools/fetch_runtime.mjs
          python platform/tools/build_engine.py

      - name: Native and browser engines agree
        run: VENV_PY=$(command -v python) node platform/tools/parity.mjs

      - name: Type-check and build the app
        working-directory: platform/app
        run: npm run build

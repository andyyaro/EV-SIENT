name: V2 Model Pipeline Check

on:
  push:
    branches: [v2-expansion-planning]
  pull_request:
    branches: [v2-expansion-planning]
  workflow_dispatch:

jobs:
  run-v2-model-pipeline:
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make setup

      - name: Compile Python files
        run: python -m compileall src

      - name: Run and check V2 model workflow plus Tableau exports
        run: make full-v2-tableau

      - name: Upload V2 generated outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-generated-outputs
          path: |
            data/outputs/v2_*.csv
            data/outputs/v2_*.md
            data/outputs/v2_*.json
            data/outputs/tableau/**
            data/outputs/charts/v2_*.png
            data/outputs/charts/v2/*.png
            data/outputs/deliverable_package_v2/**
            docs/assets/charts/v2_site_decision_map_readme.png
          if-no-files-found: warn

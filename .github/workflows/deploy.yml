name: deploy

# Deployment as code, without handing CI a standing key to production.
#
# The obvious way to make a deploy workflow is to give it AWS credentials. The standing rules
# forbid the easy version of that outright -- "never create long-lived access keys to simplify
# deployment" -- and the compliant version, a GitHub OIDC trust, is not free either: it creates
# a path from "can push to this repository" to "can rewrite the live public site". That is a
# persistent capability and belongs to the project owner to grant, not to the assistant to
# assume. So it is opt-in, and its absence is the default.
#
# What this workflow does instead is the half that needs no credentials and catches the
# failures that actually happened: it rebuilds every generated artifact from a clean checkout
# and asserts the deploy would be well-formed. Two real defects would have been caught here --
# a bundle whose surfaces were gitignored so a clean checkout lacked them, and a website
# embedding a Tableau workbook that had been deleted.
#
# The credentialed job runs only on manual dispatch AND only when the repository has an
# AWS_DEPLOY_ROLE_ARN configured. With no role it reports what is missing and stops, rather
# than failing in a way that trains people to ignore a red workflow.

on:
  # Same reasoning as tests.yml: one run per change, not one per event. No concurrency
  # cancellation here, deliberately - cancelling a dispatched deploy mid-run is worse than
  # paying for a duplicate validation.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually deploy (requires AWS_DEPLOY_ROLE_ARN). Unchecked = dry run."
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write        # only consumed by the deploy job, and only if a role is configured

jobs:
  validate:
    name: Deploy plan is well-formed (no credentials)
    runs-on: ubuntu-latest
    # A hung test must not burn an hour of the runner allowance. One did:
    # a test that started a real server and blocked on threading.Event().wait()
    # ran for 61 minutes before anyone noticed, on a private repo where minutes
    # are metered. Fail fast and loudly instead.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test] -c requirements-lock.txt

      - name: Rebuild every generated artifact from a clean checkout
        # The bundle's copied surfaces are generated, so a clean checkout does not have them.
        # CI was red for three commits before this was understood; building here means the
        # next person to clone gets the same result CI does.
        run: |
          python scripts/build_platform_web.py
          python scripts/build_field_schema.py
          python scripts/build_engine_record.py
          python scripts/build_simulink_view.py
          python scripts/build_platform_surfaces.py

      - name: Public website carries its caveats and embeds only the canonical workbook
        # The patcher rebuilds the site's specimen cards from the study's own results, which
        # carry its private inputs (DEC-016). The public repository does not hold them, so
        # there this step says so and stops; the private archive runs it in full.
        run: |
          if [ ! -f data/inputs/real_sites_v2.csv ] || [ ! -f tests/fixture_milestone2_v3_site_results.csv ]; then
            echo "SKIPPED: needs the study's private inputs (DEC-016), which this checkout does not hold"
            exit 0
          fi
          python scripts/patch_site_www.py
          python scripts/retarget_tableau_embeds.py
          python scripts/check_site_www.py

      - name: Every surface link resolves the way S3 resolves it
        # A trailing slash means index.html. Python's http.server generates directory listings
        # and S3 does not, so passing locally proved nothing -- five surfaces were 404s in
        # production while every local check was green.
        run: python scripts/check_surface_links.py

      - name: No credentials, tokens or account ids in anything tracked
        run: python scripts/secret_scan.py

      - name: The deploy script publishes the public site only and refuses the retired gate
        # The Cognito-gated /platform* path was retired on 2026-10-18 (DEC-030). The deploy
        # script must not be able to rebuild it, must not touch the distribution config, and
        # must report a gate left on the distribution, including a Lambda on the DEFAULT
        # behaviour, which would gate the NFC tag pages. A guard nobody exercises is a guard
        # nobody can trust.
        run: |
          python - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("dp", "scripts/deploy_platform.py")
          dp = importlib.util.module_from_spec(spec); spec.loader.exec_module(dp)

          # 1. Every gate or platform mode is refused before anything runs.
          for flag in ("--platform", "--gate", "--full"):
              if dp.main([flag, "--apply"]) != 2:
                  sys.exit(f"FAIL: {flag} was not refused")

          # 2. A gate left on the distribution is reported, and a clean config is not.
          clean = {"Origins": {"Quantity": 1, "Items": [{"Id": "main"}]},
                   "CacheBehaviors": {"Quantity": 0},
                   "DefaultCacheBehavior": {"LambdaFunctionAssociations": {"Quantity": 0}}}
          gated = {"Origins": {"Quantity": 2, "Items": [{"Id": "main"}, {"Id": "platform-gated"}]},
                   "CacheBehaviors": {"Quantity": 1, "Items": [{"PathPattern": "/platform*"}]},
                   "DefaultCacheBehavior": {"LambdaFunctionAssociations": {"Quantity": 1}}}
          if dp.gate_leftovers(clean) or len(dp.gate_leftovers(gated)) != 3:
              sys.exit("FAIL: gate leftovers are not reported correctly")

          # 3. The script never sends a distribution config.
          if "update-distribution" in open("scripts/deploy_platform.py").read():
              sys.exit("FAIL: the deploy script can rewrite the distribution config")

          print("gate and platform modes refused; leftovers reported; no distribution writes")
          PY

  deploy:
    name: Deploy to AWS (opt-in, manual only)
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A hung test must not burn an hour of the runner allowance. One did:
    # a test that started a real server and blocked on threading.Event().wait()
    # ran for 61 minutes before anyone noticed, on a private repo where minutes
    # are metered. Fail fast and loudly instead.
    timeout-minutes: 20
    steps:
      - name: Check whether a deploy role is configured
        id: role
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No AWS_DEPLOY_ROLE_ARN is configured, so this workflow cannot deploy."
            echo "Deployment currently runs locally, where AWS SSO works:"
            echo "    aws sso login --profile future-city"
            echo "    python scripts/deploy_platform.py            # dry run"
            echo "    python scripts/deploy_platform.py --apply"
            echo ""
            echo "To enable deploying from CI, see DEPLOYMENT.md -> 'Deploying from CI'."
            echo "That grants anyone who can dispatch this workflow the ability to rewrite the"
            echo "live public site, which is why it is not configured by default."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.role.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Assume the deploy role via OIDC
        if: steps.role.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python
        if: steps.role.outputs.configured == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        if: steps.role.outputs.configured == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e . -c requirements-lock.txt

      - name: Deploy
        if: steps.role.outputs.configured == 'true'
        # The script is dry-run by default. --apply is passed only when the operator ticked the
        # box, so a mis-dispatched run reports its plan instead of changing production.
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python scripts/deploy_platform.py --apply
          else
            python scripts/deploy_platform.py
          fi

      - name: Verify the deployment from the outside
        if: steps.role.outputs.configured == 'true' && inputs.apply
        # Both halves, always: the retired /platform path serves nothing AND the NFC field
        # layer is still open.
        run: python scripts/verify_deployment.py

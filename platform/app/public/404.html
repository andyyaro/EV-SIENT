<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Page not found | EV-SIENT Planner</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --link: #0066cc;
    --border: rgba(0, 0, 0, 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --link: #4da3ff;
      --border: rgba(255, 255, 255, 0.14);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.47 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  main {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 440px;
    width: 100%;
  }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: var(--muted); }
  a {
    display: inline-block;
    min-height: 44px;
    line-height: 44px;
    color: var(--link);
    font-weight: 600;
    text-decoration: none;
  }
  a:hover, a:focus-visible { text-decoration: underline; }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>There is nothing at this address. The EV-SIENT Planner runs from its start page.</p>
  <a href="/">Go to the EV-SIENT Planner</a>
</main>
</body>
</html>

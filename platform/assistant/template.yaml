AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  EV-SIENT Planner assistant proxy: a streaming Lambda function URL (AWS_IAM, reached only through
  CloudFront with origin access control) that calls an AI model through OpenAI's API, Anthropic's
  Claude API or Amazon Bedrock (Provider), with a DynamoDB spend ledger and rate limits, alarms
  and budgets.
  See platform/assistant/README.md. Tag Project=evsient-platform.

# Deploy with platform/assistant/deploy/deploy.sh (profile future-city). With Provider=openai
# (the default), the OpenAI key is read from the earlier site assistant's Secrets Manager secret.
# With Provider=bedrock, Bedrock data retention must be set to none in the stack's Region first.
# With Provider=anthropic, the Claude API key must be in SSM Parameter Store first (README).

Parameters:
  Provider:
    Type: String
    AllowedValues: [openai, anthropic, bedrock]
    Default: openai
    Description: >-
      Who answers: openai (OpenAI's Responses API, key in the Secrets Manager secret below),
      anthropic (Anthropic's Claude API, key in SSM Parameter Store) or bedrock (Claude on Amazon
      Bedrock, global inference profile). Each grants only its own permissions.
  OpenAIModel:
    Type: String
    AllowedValues: [gpt-5.4-mini]
    Default: gpt-5.4-mini
    Description: The OpenAI model, for Provider=openai. Only models with a row in src/pricing.mjs.
  OpenAIExtraJson:
    Type: String
    Default: '{}'
    Description: Extra request fields for the OpenAI model (JSON object; reasoning effort and text verbosity only).
  OpenAISecretName:
    Type: String
    Default: future-city-assistant-secrets
    AllowedPattern: '^[A-Za-z0-9/_+=.@-]{1,500}$'
    Description: >-
      Name (never the value) of the Secrets Manager secret whose JSON field OPENAI_API_KEY holds
      the OpenAI key, for Provider=openai. The earlier site assistant's secret.
  OpenAISecretRegion:
    Type: String
    Default: us-east-1
    AllowedPattern: '^[a-z]{2}(-[a-z]+)+-[0-9]$'
    Description: The Region the secret is in (read across Regions).
  AnthropicKeyParameter:
    Type: String
    Default: /evsient/assistant/anthropic-api-key
    AllowedPattern: '^/[A-Za-z0-9/_.-]{1,500}$'
    Description: Name (never the value) of the SSM SecureString holding the Claude API key, for Provider=anthropic.
  Enabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: 'false refuses every question before the model (the panel says the assistant is switched off).'
  MonthlyCapUsd:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 50
    Description: Hard cap on model spend per calendar month (UTC), in US dollars. 0 refuses every question.
  DailyCapUsd:
    Type: Number
    Default: 0.35
    MinValue: 0
    MaxValue: 50
    Description: Cap per day (UTC), so one bad day cannot use the whole month.
  DeeperMonthlyCapUsd:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 50
    Description: Sub-cap for deeper answers (Sonnet), inside the monthly cap.
  AddressDailyCapUsd:
    Type: Number
    Default: 0.05
    MinValue: 0
    MaxValue: 5
    Description: One visitor's (address block's) share of a day's spend, so one person cannot use the day's cap.
  ReservedConcurrency:
    Type: String
    Default: ''
    AllowedPattern: '^([1-9][0-9]?)?$'
    Description: >-
      Optional cap on concurrent instances (1 to 99). Empty leaves it unset: the account's
      concurrency limit of 10 does not allow reserving any until a quota increase.
  EnableDeeper:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: 'true offers deeper answers with Sonnet 5.5 (Claude providers only; ignored with openai).'
  StandardModel:
    Type: String
    Default: anthropic.claude-haiku-5-5
    AllowedPattern: '^anthropic\.[a-z0-9-]+$'
    Description: >-
      The standard model as Bedrock names it. Bedrock calls global.<this>; the Claude API calls
      the part after "anthropic." (claude-haiku-5-5).
  DeeperModel:
    Type: String
    Default: anthropic.claude-sonnet-5-5
    AllowedPattern: '^anthropic\.[a-z0-9-]+$'
  ModelExtraJson:
    Type: String
    Default: '{"thinking":{"type":"disabled"}}'
    Description: Extra request fields for the standard model (JSON object). Leave as is unless a test call shows otherwise.
  DistributionId:
    Type: String
    Default: E1JXKS26TDP3Z2
    Description: The app's CloudFront distribution (app.futurecity.andyyaro.com).
  AlertEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+$'
    NoEcho: true
    Description: Where alarms and budget alerts go. Given at deploy time; never committed.
  NonModelBudgetUsd:
    Type: Number
    Default: 10
    Description: Monthly budget for everything tagged Project=evsient-platform (excludes model spend).
  Runtime:
    Type: String
    Default: nodejs24.x

Conditions:
  Deeper: !Equals [!Ref EnableDeeper, 'true']
  IsBedrock: !Equals [!Ref Provider, bedrock]
  IsAnthropic: !Equals [!Ref Provider, anthropic]
  IsOpenAI: !Equals [!Ref Provider, openai]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, '']]

Resources:
  # ------------------------------------------------------------------ ledger and limits
  Table:
    Type: AWS::DynamoDB::Table
    # The ledger must outlive the stack: deleting it mid-month would forget what was spent.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: evsient-assistant
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }
      SSESpecification: { SSEEnabled: false }   # AWS-owned key: encrypted at rest, no KMS charge
      Tags:
        - { Key: Project, Value: evsient-platform }

  # ------------------------------------------------------------------ function
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/evsient-assistant
      RetentionInDays: 7
      Tags:
        - { Key: Project, Value: evsient-platform }

  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub evsient-assistant-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
      Tags:
        - { Key: Project, Value: evsient-platform }
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: !Sub '${LogGroup.Arn}'
        - PolicyName: ledger
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # TransactWriteItems is authorised per item as UpdateItem; PutItem is the salt.
              - Effect: Allow
                Action: ['dynamodb:GetItem', 'dynamodb:PutItem', 'dynamodb:UpdateItem']
                Resource: !GetAtt Table.Arn
        # Provider=bedrock only: retention read and streaming invoke.
        - !If
          - IsBedrock
          - PolicyName: bedrock
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # Reading (never setting) the account's data retention mode: the function
                # refuses to answer unless it is "none".
                - Sid: ReadDataRetention
                  Effect: Allow
                  Action: bedrock:GetAccountDataRetention
                  Resource: '*'
                # Global cross-Region inference: the profile in this Region, the model in this
                # Region through that profile, and the model with no Region ("unspecified")
                # through that profile. Streaming invoke only; nothing else in Bedrock.
                - Sid: StandardProfile
                  Effect: Allow
                  Action: bedrock:InvokeModelWithResponseStream
                  Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${StandardModel}'
                  Condition:
                    StringEquals: { 'aws:RequestedRegion': !Ref 'AWS::Region' }
                - Sid: StandardRegional
                  Effect: Allow
                  Action: bedrock:InvokeModelWithResponseStream
                  Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${StandardModel}'
                  Condition:
                    StringEquals: { 'aws:RequestedRegion': !Ref 'AWS::Region' }
                    StringLike: { 'bedrock:InferenceProfileArn': !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${StandardModel}' }
                - Sid: StandardGlobal
                  Effect: Allow
                  Action: bedrock:InvokeModelWithResponseStream
                  Resource: !Sub 'arn:aws:bedrock:::foundation-model/${StandardModel}'
                  Condition:
                    StringEquals: { 'aws:RequestedRegion': unspecified }
                    StringLike: { 'bedrock:InferenceProfileArn': !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${StandardModel}' }
                - !If
                  - Deeper
                  - Sid: DeeperProfile
                    Effect: Allow
                    Action: bedrock:InvokeModelWithResponseStream
                    Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${DeeperModel}'
                    Condition:
                      StringEquals: { 'aws:RequestedRegion': !Ref 'AWS::Region' }
                  - !Ref AWS::NoValue
                - !If
                  - Deeper
                  - Sid: DeeperRegional
                    Effect: Allow
                    Action: bedrock:InvokeModelWithResponseStream
                    Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${DeeperModel}'
                    Condition:
                      StringEquals: { 'aws:RequestedRegion': !Ref 'AWS::Region' }
                      StringLike: { 'bedrock:InferenceProfileArn': !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${DeeperModel}' }
                  - !Ref AWS::NoValue
                - !If
                  - Deeper
                  - Sid: DeeperGlobal
                    Effect: Allow
                    Action: bedrock:InvokeModelWithResponseStream
                    Resource: !Sub 'arn:aws:bedrock:::foundation-model/${DeeperModel}'
                    Condition:
                      StringEquals: { 'aws:RequestedRegion': unspecified }
                      StringLike: { 'bedrock:InferenceProfileArn': !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${DeeperModel}' }
                  - !Ref AWS::NoValue
          - !Ref AWS::NoValue
        # Provider=openai: read the one secret holding the OpenAI key, in its own Region. The
        # ARN ends in a six-character suffix Secrets Manager adds, matched by ??????; nothing
        # else in Secrets Manager. A secret encrypted with the AWS managed key aws/secretsmanager
        # needs no KMS statement (its key policy allows decryption through Secrets Manager in
        # this account); a customer managed key would need one, and until then the read fails
        # and the assistant stays unavailable.
        - !If
          - IsOpenAI
          - PolicyName: openai-key
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: ReadOpenAIKey
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Sub 'arn:aws:secretsmanager:${OpenAISecretRegion}:${AWS::AccountId}:secret:${OpenAISecretName}-??????'
          - !Ref AWS::NoValue
        # Provider=anthropic: read the Claude API key, one parameter only. SSM decrypts it with the
        # AWS managed key aws/ssm, whose key policy already lets principals in this account decrypt
        # through SSM; the KMS statement makes that explicit and limits it to this one parameter.
        - !If
          - IsAnthropic
          - PolicyName: anthropic-key
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: ReadAnthropicKey
                  Effect: Allow
                  Action: ssm:GetParameter
                  Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnthropicKeyParameter}'
                - Sid: DecryptAnthropicKeyThroughSsm
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                  Condition:
                    StringEquals:
                      'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'
                      'kms:EncryptionContext:PARAMETER_ARN': !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnthropicKeyParameter}'
          - !Ref AWS::NoValue

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: evsient-assistant
      Description: EV-SIENT Planner assistant proxy (spend-capped)
      Runtime: !Ref Runtime
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 60
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref 'AWS::NoValue']
      Role: !GetAtt Role.Arn
      LoggingConfig: { LogGroup: !Ref LogGroup, LogFormat: Text }
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          ASSISTANT_ENABLED: !Ref Enabled
          MONTHLY_CAP_USD: !Ref MonthlyCapUsd
          DAILY_CAP_USD: !Ref DailyCapUsd
          DEEPER_MONTHLY_CAP_USD: !Ref DeeperMonthlyCapUsd
          ADDRESS_DAILY_CAP_USD: !Ref AddressDailyCapUsd
          PROVIDER: !Ref Provider
          ANTHROPIC_KEY_PARAMETER: !Ref AnthropicKeyParameter
          OPENAI_SECRET_ID: !Ref OpenAISecretName
          OPENAI_SECRET_REGION: !Ref OpenAISecretRegion
          # OpenAI: the model as named. Bedrock: the global inference profile. Claude API: the ID
          # after "anthropic.".
          MODEL_ID: !If
            - IsOpenAI
            - !Ref OpenAIModel
            - !If [IsBedrock, !Sub 'global.${StandardModel}', !Select [1, !Split ['.', !Ref StandardModel]]]
          MODEL_EXTRA_JSON: !If [IsOpenAI, !Ref OpenAIExtraJson, !Ref ModelExtraJson]
          DEEPER_MODEL_ID: !If
            - IsOpenAI
            - ''
            - !If
              - Deeper
              - !If [IsBedrock, !Sub 'global.${DeeperModel}', !Select [1, !Split ['.', !Ref DeeperModel]]]
              - ''
      # A stand-in until deploy.sh uploads the real code: it refuses every request.
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            headers: { 'content-type': 'application/json', 'cache-control': 'no-store' },
            body: JSON.stringify({ error: 'unavailable', message: 'The assistant is not available right now. Everything else in the planner keeps working.' }),
          });
      Tags:
        - { Key: Project, Value: evsient-platform }

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: AWS_IAM
      InvokeMode: RESPONSE_STREAM

  # Only this distribution may call the URL (origin access control signs each request).
  AllowCloudFrontUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'
      FunctionUrlAuthType: AWS_IAM
  # Function URLs also need lambda:InvokeFunction; InvokedViaFunctionUrl limits this grant to
  # calls that come through the URL, so CloudFront cannot invoke the function any other way.
  AllowCloudFrontInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'
      SourceAccount: !Ref 'AWS::AccountId'
      InvokedViaFunctionUrl: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: evsient-assistant-oac
        Description: Signs requests from the app distribution to the assistant function URL
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # ------------------------------------------------------------------ alerts
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: evsient-assistant-alerts
      Tags:
        - { Key: Project, Value: evsient-platform }
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }

  # A request without CloudFront-Viewer-Address means the behaviour lost its origin request
  # policy: every such request then shares one conservative bucket. Logged at most once a
  # minute per instance.
  NoViewerAddressFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"no_viewer_address"'
      MetricTransformations:
        - { MetricNamespace: EVSIENT/Assistant, MetricName: NoViewerAddress, MetricValue: '1', DefaultValue: 0 }
  NoViewerAddressAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: NoViewerAddressFilter
    Properties:
      AlarmName: evsient-assistant-no-viewer-address
      AlarmDescription: Requests arrived without CloudFront-Viewer-Address (check the /api/assistant/* origin request policy).
      Namespace: EVSIENT/Assistant
      MetricName: NoViewerAddress
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # The function logs {"event":"cap_reached"} when it refuses for a cap.
  CapReachedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"cap_reached"'
      MetricTransformations:
        - { MetricNamespace: EVSIENT/Assistant, MetricName: CapReached, MetricValue: '1', DefaultValue: 0 }
  CapReachedAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: CapReachedFilter
    Properties:
      AlarmName: evsient-assistant-cap-reached
      AlarmDescription: The assistant refused a question because a spend cap was reached.
      Namespace: EVSIENT/Assistant
      MetricName: CapReached
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  BusyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: evsient-assistant-busy
      AlarmDescription: More than 60 requests in 5 minutes, three periods running (possible abuse).
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref Function }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 60
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: evsient-assistant-errors
      AlarmDescription: The assistant function failed 5 or more times in 15 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Function }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # Budgets alert; they never stop anything (the ledger does). Model spend in this Region (the
  # assistant runs nowhere else, and global inference bills to the calling Region), and
  # everything else tagged Project=evsient-platform (activate that cost allocation tag first).
  # With Provider=openai or anthropic, model spend is billed by OpenAI or Anthropic, not AWS:
  # the second cap there is the provider's own project budget or spend limit (README).
  ModelBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub evsient-assistant-${AWS::Region}
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyCapUsd, Unit: USD }
        CostFilters:
          Region: [!Ref 'AWS::Region']
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
  PlatformBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: evsient-platform-non-model
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref NonModelBudgetUsd, Unit: USD }
        CostFilters:
          TagKeyValue: ['user:Project$evsient-platform']
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

  # Optional guard, attached by hand to the account's admin principals (see README): nobody
  # using it can switch Bedrock data retention to anything but none.
  RetentionGuardPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: evsient-bedrock-retention-none-only
      Description: Denies setting Bedrock account data retention to anything other than none.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RetentionNoneOnly
            Effect: Deny
            Action: bedrock:PutAccountDataRetention
            Resource: '*'
            Condition:
              StringNotEquals: { 'bedrock:DataRetentionMode': none }

Outputs:
  FunctionUrlDomain:
    Description: The origin domain for CloudFront (no scheme, no slash).
    Value: !Select [2, !Split ['/', !GetAtt FunctionUrl.FunctionUrl]]
  OriginAccessControlId:
    Value: !GetAtt OriginAccessControl.Id
  TableName:
    Value: !Ref Table
  FunctionName:
    Value: !Ref Function

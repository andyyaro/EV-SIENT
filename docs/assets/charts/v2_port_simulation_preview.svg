<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">V2 Port Simulation Preview</title>
  <desc id="desc">Preview of V2 port simulation and right-sizing validation results.</desc>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2937">V2 Port-Use Simulation Preview</text>
  <text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Current-demand simulation minimum was 2 ports for all 12 sites; future-ready capacity is mostly conservative.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14">
    <rect x="60" y="115" width="480" height="360" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="85" y="150" font-size="20" font-weight="700" fill="#111827">Current demand check</text>
    <text x="85" y="180" fill="#374151">Near-term recommendation compared with simulated current need.</text>
    <circle cx="130" cy="250" r="58" fill="#dcfce7" stroke="#86efac" stroke-width="3"/>
    <text x="130" y="242" text-anchor="middle" font-size="34" font-weight="700" fill="#166534">11</text>
    <text x="130" y="268" text-anchor="middle" fill="#166534">aligned</text>
    <circle cx="320" cy="250" r="58" fill="#fef3c7" stroke="#fcd34d" stroke-width="3"/>
    <text x="320" y="242" text-anchor="middle" font-size="34" font-weight="700" fill="#92400e">1</text>
    <text x="320" y="268" text-anchor="middle" fill="#92400e">conservative</text>
    <text x="85" y="350" font-size="16" font-weight="700" fill="#111827">Only conservative current case:</text>
    <text x="85" y="380" fill="#374151">FFX004 — Fairfax County Government Center</text>
    <text x="85" y="405" fill="#374151">ports_now = 3 · sim_min_ports_current = 2</text>
    <text x="85" y="430" fill="#374151">No current site was flagged underbuilt.</text>
    <rect x="585" y="115" width="455" height="360" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="610" y="150" font-size="20" font-weight="700" fill="#111827">Future-ready check</text>
    <text x="610" y="180" fill="#374151">Future-ready capacity compared with 2050 high-growth simulation.</text>
    <circle cx="680" cy="250" r="58" fill="#dcfce7" stroke="#86efac" stroke-width="3"/>
    <text x="680" y="242" text-anchor="middle" font-size="34" font-weight="700" fill="#166534">3</text>
    <text x="680" y="268" text-anchor="middle" fill="#166534">aligned</text>
    <circle cx="870" cy="250" r="58" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/>
    <text x="870" y="242" text-anchor="middle" font-size="34" font-weight="700" fill="#1d4ed8">9</text>
    <text x="870" y="268" text-anchor="middle" fill="#1d4ed8">conservative</text>
    <text x="610" y="350" font-size="16" font-weight="700" fill="#111827">Interpretation:</text>
    <text x="610" y="380" fill="#374151">Future-ready capacity is not underbuilt under tested assumptions.</text>
    <text x="610" y="405" fill="#374151">Top sites preserve extra capacity for longer-term growth.</text>
    <text x="610" y="430" fill="#374151">This is a planning-screen signal, not final design.</text>
  </g>
  <rect x="60" y="520" width="980" height="48" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="85" y="550" font-family="Arial" font-size="16" fill="#1e40af">Right-sizing loop: recommendation → port-use simulation → validation labels → executive decision table.</text>
  <text x="60" y="600" font-family="Arial" font-size="12" fill="#6b7280">Prototype assumptions still need site owner, utility, engineering, ADA, AHJ, and stakeholder confirmation.</text>
</svg>

  <g transform="translate(1010,120)" font-family="Arial" font-size="13">
    <rect x="0" y="0" width="170" height="230" rx="6" fill="white" stroke="#333"/>
    <text x="12" y="25" font-weight="700">Ranked readiness</text>
    <text x="12" y="55">#1 FFX002: 65.3</text><text x="12" y="75">#2 FFX001: 57.3</text><text x="12" y="95">#3 PWC002: 56.0</text><text x="12" y="115">#4 PWC004: 52.7</text><text x="12" y="135">#5 PWC001: 43.2</text><text x="12" y="155">#6 PWC003: 29.5</text>
    <text x="12" y="190">star = top site</text><text x="12" y="210">shape = tier</text>
  </g>
  <g transform="translate(1010,525)"><rect x="0" y="0" width="160" height="18" fill="#3b528b"/><rect x="40" y="0" width="40" height="18" fill="#21918c"/><rect x="80" y="0" width="40" height="18" fill="#5ec962"/><rect x="120" y="0" width="40" height="18" fill="#fde725"/><text x="80" y="40" text-anchor="middle" font-family="Arial" font-size="12">Readiness score</text></g>
  <text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="12">Planning notes: PWC002 = high-review garage candidate; PWC004 = future/reopened planning assumption; PWC003 = public-access decision needed.</text>
  <text x="600" y="655" text-anchor="middle" font-family="Arial" font-size="12">Planning visual only — no basemap, parcel boundary, engineering layout, utility-service map, or permitting decision.</text>
</svg>

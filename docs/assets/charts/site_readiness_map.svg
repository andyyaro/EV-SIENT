    <g stroke="#e5e5e5"><line x1="0" y1="51" x2="320" y2="51"/><line x1="0" y1="102" x2="320" y2="102"/><line x1="0" y1="153" x2="320" y2="153"/><line x1="80" y1="0" x2="80" y2="205"/><line x1="160" y1="0" x2="160" y2="205"/><line x1="240" y1="0" x2="240" y2="205"/></g>
    <rect x="245" y="145" width="28" height="28" fill="#78c981" stroke="#111"/><text x="165" y="145" font-family="Arial" font-size="12">#3 PWC002</text><text x="165" y="160" font-family="Arial" font-size="12">56.0</text>
    <polygon points="230,72 250,112 210,112" fill="#58b99b" stroke="#111"/><text x="255" y="84" font-family="Arial" font-size="12">#4 PWC004</text><text x="255" y="99" font-family="Arial" font-size="12">52.7</text>
    <polygon points="215,35 240,60 215,85 190,60" fill="#3f7f99" stroke="#111"/><text x="248" y="52" font-family="Arial" font-size="12">#5 PWC001</text><text x="248" y="67" font-family="Arial" font-size="12">43.2</text>
    <text x="58" y="95" font-size="26" fill="#6a3d9a" stroke="#111" stroke-width="0.5">✖</text><text x="82" y="82" font-family="Arial" font-size="12">#6 PWC003</text><text x="82" y="97" font-family="Arial" font-size="12">29.5</text>

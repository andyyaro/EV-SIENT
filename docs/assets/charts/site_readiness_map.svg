<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Candidate EV charging site readiness map">
  <rect width="1200" height="700" fill="white"/>
  <text x="600" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Candidate EV Charging Sites — Readiness Map</text>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">FFX002 is the stable top candidate: #1 in the base model, stable in sensitivity, and #1 across 5 scoring profiles.</text>

  <g transform="translate(55,90)">
    <rect x="0" y="0" width="520" height="455" fill="#fff" stroke="#222"/>
    <text x="260" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Overview: all candidate sites</text>
    <g stroke="#e5e5e5"><line x1="0" y1="90" x2="520" y2="90"/><line x1="0" y1="180" x2="520" y2="180"/><line x1="0" y1="270" x2="520" y2="270"/><line x1="0" y1="360" x2="520" y2="360"/><line x1="104" y1="0" x2="104" y2="455"/><line x1="208" y1="0" x2="208" y2="455"/><line x1="312" y1="0" x2="312" y2="455"/><line x1="416" y1="0" x2="416" y2="455"/></g>
    <rect x="405" y="45" width="70" height="55" fill="none" stroke="#777" stroke-dasharray="5 4"/><rect x="55" y="260" width="420" height="150" fill="none" stroke="#777" stroke-dasharray="5 4"/>
    <text x="440" y="42" text-anchor="middle" font-family="Arial" font-size="11">Fairfax City zoom</text><text x="265" y="258" text-anchor="middle" font-family="Arial" font-size="11">Prince William County zoom</text>
    <g font-family="Arial" font-size="12">
      <circle cx="430" cy="74" r="18" fill="#80c77a" stroke="#111"/><text x="452" y="71">#1 FFX002</text><text x="452" y="86">65.3</text><text x="430" y="80" text-anchor="middle" font-size="26">★</text>
      <circle cx="395" cy="88" r="18" fill="#91d17e" stroke="#111"/><text x="310" y="88">#2 FFX001</text><text x="310" y="103">57.3</text>
      <rect x="440" y="350" width="28" height="28" fill="#78c981" stroke="#111"/><text x="360" y="360">#3 PWC002</text><text x="360" y="375">56.0</text>
      <polygon points="384,285 404,325 364,325" fill="#58b99b" stroke="#111"/><text x="410" y="305">#4 PWC004</text><text x="410" y="320">52.7</text>
      <polygon points="340,270 365,295 340,320 315,295" fill="#3f7f99" stroke="#111"/><text x="368" y="285">#5 PWC001</text><text x="368" y="300">43.2</text>
      <text x="78" y="314" font-size="26" fill="#6a3d9a" stroke="#111" stroke-width="0.5">✖</text><text x="100" y="300">#6 PWC003</text><text x="100" y="315">29.5</text>
    </g>
    <g font-family="Arial" font-size="12"><text x="0" y="480">Longitude</text><text x="-35" y="230" transform="rotate(-90 -35 230)">Latitude</text></g>
  </g>

  <g transform="translate(650,90)">
    <rect x="0" y="0" width="320" height="190" fill="#fff" stroke="#222"/>
    <text x="160" y="-12" text-anchor="middle" font-family="Arial" font-size="15">Zoom: Fairfax City</text>
    <g stroke="#e5e5e5"><line x1="0" y1="48" x2="320" y2="48"/><line x1="0" y1="96" x2="320" y2="96"/><line x1="0" y1="144" x2="320" y2="144"/><line x1="80" y1="0" x2="80" y2="190"/><line x1="160" y1="0" x2="160" y2="190"/><line x1="240" y1="0" x2="240" y2="190"/></g>
    <circle cx="210" cy="78" r="18" fill="#f3e34f" stroke="#111"/><text x="210" y="85" text-anchor="middle" font-size="26">★</text><text x="230" y="62" font-family="Arial" font-size="12">#1 FFX002</text><text x="230" y="77" font-family="Arial" font-size="12">65.3</text>
    <circle cx="90" cy="125" r="18" fill="#91d17e" stroke="#111"/><text x="25" y="123" font-family="Arial" font-size="12">#2 FFX001</text><text x="25" y="138" font-family="Arial" font-size="12">57.3</text>
  </g>


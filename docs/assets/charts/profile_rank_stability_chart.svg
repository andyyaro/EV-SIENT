<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="Profile rank stability chart">
  <rect width="980" height="520" fill="white"/>
  <text x="490" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Rank Stability Across Scoring Profiles</text>
  <text x="490" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#444">Flat lines mean rankings stay stable when planning priorities change.</text>
  <g stroke="#e0e0e0" font-family="Arial, sans-serif" font-size="12" fill="#555">
    <line x1="130" y1="110" x2="900" y2="110"/><text x="105" y="114" text-anchor="end">1</text>
    <line x1="130" y1="160" x2="900" y2="160"/><text x="105" y="164" text-anchor="end">2</text>
    <line x1="130" y1="210" x2="900" y2="210"/><text x="105" y="214" text-anchor="end">3</text>
    <line x1="130" y1="260" x2="900" y2="260"/><text x="105" y="264" text-anchor="end">4</text>
    <line x1="130" y1="310" x2="900" y2="310"/><text x="105" y="314" text-anchor="end">5</text>
    <line x1="130" y1="360" x2="900" y2="360"/><text x="105" y="364" text-anchor="end">6</text>
  </g>
  <g stroke="#ddd"><line x1="130" y1="95" x2="130" y2="380"/><line x1="322" y1="95" x2="322" y2="380"/><line x1="515" y1="95" x2="515" y2="380"/><line x1="707" y1="95" x2="707" y2="380"/><line x1="900" y1="95" x2="900" y2="380"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#333"><text x="130" y="405" text-anchor="middle">base</text><text x="322" y="405" text-anchor="middle">demand</text><text x="515" y="405" text-anchor="middle">equity</text><text x="707" y="405" text-anchor="middle">feasibility</text><text x="900" y="405" text-anchor="middle">safety</text></g>
  <g fill="none" stroke-width="3">
    <path d="M130 110 L322 110 L515 110 L707 110 L900 110" stroke="#1b9e77"/><path d="M130 160 L322 160 L515 160 L707 160 L900 160" stroke="#d95f02"/><path d="M130 210 L322 210 L515 210 L707 210 L900 210" stroke="#7570b3"/><path d="M130 260 L322 260 L515 260 L707 260 L900 260" stroke="#e7298a"/><path d="M130 310 L322 310 L515 310 L707 310 L900 310" stroke="#66a61e"/><path d="M130 360 L322 360 L515 360 L707 360 L900 360" stroke="#e6ab02"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#111"><text x="910" y="114">FFX002</text><text x="910" y="164">FFX001</text><text x="910" y="214">PWC002</text><text x="910" y="264">PWC004</text><text x="910" y="314">PWC001</text><text x="910" y="364">PWC003</text></g>
  <text x="70" y="240" transform="rotate(-90 70 240)" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Rank (1 = best)</text>
</svg>

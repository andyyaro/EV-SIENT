  <circle cx="1080" cy="395" r="13" fill="#16a34a"/><text x="1105" y="402" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">PWC007 — Rank 6</text>
  <circle cx="955" cy="455" r="13" fill="#16a34a"/><text x="980" y="462" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">PWC004 — Rank 7</text>

  </g>
  <g font-family="Arial, sans-serif" font-size="16">
    <text x="20" y="125">#1 FFX002</text><rect x="170" y="104" width="620" height="34" rx="3" fill="#2c7fb8"/><text x="805" y="126">65.3 — Tier 1</text>
    <text x="20" y="175">#2 FFX001</text><rect x="170" y="154" width="544" height="34" rx="3" fill="#2c7fb8"/><text x="729" y="176">57.3 — Tier 1</text>
    <text x="20" y="225">#3 PWC002</text><rect x="170" y="204" width="532" height="34" rx="3" fill="#2c7fb8"/><text x="717" y="226">56.0 — High-review</text>
    <text x="20" y="275">#4 PWC004</text><rect x="170" y="254" width="501" height="34" rx="3" fill="#2c7fb8"/><text x="686" y="276">52.7 — Tier 2</text>
    <text x="20" y="325">#5 PWC001</text><rect x="170" y="304" width="410" height="34" rx="3" fill="#2c7fb8"/><text x="595" y="326">43.2 — Tier 3</text>
    <text x="20" y="375">#6 PWC003</text><rect x="170" y="354" width="280" height="34" rx="3" fill="#2c7fb8"/><text x="465" y="376">29.5 — Special-use</text>

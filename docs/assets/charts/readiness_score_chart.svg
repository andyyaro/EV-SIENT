<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="Readiness score chart">
  <rect width="980" height="520" fill="white"/>
  <text x="490" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Readiness Score by Candidate Site</text>
  <text x="490" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#444">Higher score means stronger planning readiness under current assumptions.</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#666">
    <line x1="170" y1="95" x2="170" y2="405" stroke="#ddd"/><line x1="360" y1="95" x2="360" y2="405" stroke="#ddd"/><line x1="550" y1="95" x2="550" y2="405" stroke="#ddd"/><line x1="740" y1="95" x2="740" y2="405" stroke="#ddd"/><line x1="930" y1="95" x2="930" y2="405" stroke="#ddd"/>
